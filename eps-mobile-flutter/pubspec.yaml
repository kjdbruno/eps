name: eps_mobile
description: "ePS — Community Engagement Platform (citizen mobile app)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State — ChangeNotifier maps closely to the web app's Pinia stores.
  provider: ^6.1.2

  # HTTP — Dio interceptors mirror src/boot/axios.js (api key + bearer token).
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Storage: token in the keystore/keychain, everything else in prefs.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Realtime — mirrors src/boot/socket.js
  socket_io_client: ^3.0.2

  # Evidence photos for complaints / follow-ups
  image_picker: ^1.1.2

  # Mandatory geolocation capture when a citizen files feedback (see file_complaint_screen.dart).
  geolocator: ^13.0.2

  # Push notifications (see push_service.dart / utils/push.js on the backend). firebase_core is
  # the platform bootstrap every other Firebase package needs; firebase_messaging is FCM itself.
  # flutter_local_notifications (foreground system-tray display) is temporarily removed — FCM
  # still auto-displays a notification whenever the app is backgrounded/terminated.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6

  # Misc
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  http_parser: ^4.0.2

  # App-wide typeface (see lib/src/theme/app_theme.dart).
  google_fonts: ^6.2.1

# path_provider_android 2.3.x switched to `jni`, which drags in the Android NDK
# (a ~1 GB toolchain download) just so the cache dir can be read. Nothing here
# needs that — pin to the last 2.2.x, which uses the plain platform channel.
dependency_overrides:
  path_provider_android: 2.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Generates the OS-level launch screen (before the Flutter engine starts).
  # Regenerate after changing the block below:  dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.4

  # Generates the launcher icons for every density/platform.
  # Regenerate after changing the block below:  dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# OS launch screen — the official ePS wordmark (from eps-www-quasar-external's
# src/assets/epslogo.png) on white. The in-app SplashScreen
# (lib/src/ui/screens/splash_screen.dart) takes over once the engine is up.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: assets/branding/eps_logo_splash.png
  image_dark: assets/branding/eps_logo_splash.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    image: assets/branding/eps_logo_splash.png
    image_dark: assets/branding/eps_logo_splash.png
  android: true
  ios: true
  web: false

# Launcher icon — the ePS "e" site mark (same artwork as the internal/external
# web clients' favicon, re-rendered at high resolution from epslogo.png).
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  web:
    generated: false
  windows:
    generated: false
  macos:
    generated: false
