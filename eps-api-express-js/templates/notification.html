<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ heading }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f6f9fc; font-family:'Segoe UI', Roboto, Arial, sans-serif; color:#1e2a44;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f9fc; padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%; max-width:600px; background-color:#ffffff; border:1px solid #e4eaf3; border-radius:16px; overflow:hidden;">

          <!-- brand band -->
          <tr>
            <td style="background-color:#004EA8; background-image:linear-gradient(135deg,#00306B 0%,#004EA8 100%); padding:28px 32px;">
              <div style="font-size:12px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:#FDB813;">CSFLU</div>
              <div style="font-size:22px; font-weight:800; color:#ffffff; line-height:1.25; padding-top:4px;">eParticipation System</div>
              <div style="font-size:12px; color:#c9d8ef; padding-top:4px;">City Government of San Fernando, La Union</div>
            </td>
          </tr>

          <!-- the update -->
          <tr>
            <td style="padding:34px 40px 8px 40px;">
              <span style="display:inline-block; padding:4px 12px; border-radius:99px; background-color:{{ badgeBg }}; color:{{ badgeInk }}; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;">{{ badge }}</span>
              <h2 style="margin:14px 0 10px 0; font-size:22px; line-height:1.3; color:#004EA8;">{{ heading }}</h2>
              <p style="margin:0; font-size:15px; line-height:1.7; color:#4c5c79;">{{ message }}</p>
            </td>
          </tr>
{{ reference }}
          <!-- what to do next -->
          <tr>
            <td style="padding:12px 40px 8px 40px;">
              <div style="background-color:#f2f6fd; border:1px solid #dce5f3; border-radius:12px; padding:14px 18px; font-size:14px; line-height:1.6; color:#4c5c79;">{{ note }}</div>
            </td>
          </tr>

          <!-- footer -->
          <tr>
            <td style="padding:20px 40px 32px 40px;">
              <div style="border-top:1px solid #e4eaf3; padding-top:18px; font-size:12px; line-height:1.6; color:#8493ac; text-align:center;">
                This is an automated message from the CSFLU eParticipation System. Please do not reply to it.<br>
                &copy; City Government of San Fernando, La Union. All rights reserved.
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
